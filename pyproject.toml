[project]
name = "autoencoders-in-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tymoteusz Lindner", email = "tymoteusz.lindner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pyaml>=26.7.0",
    "rich>=15.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
